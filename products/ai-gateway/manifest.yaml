# ai-gateway — product packaging manifest.
#
# Read by products/_scripts/export_product.py. See products/flowgrok/manifest.yaml
# for documentation of every field.

name: ai-gateway
label: "AI Gateway — multi-LLM API router"
brand: "AI Gateway"

remote:
  url: "https://github.com/nt7310063-boop/ai-gateway.git"
  branch: main

defaults:
  backend_host_port: 8000
  frontend_host_port: 5173
  postgres_user: ai_gateway
  postgres_db: ai_gateway

include:
  backend:
    - app/__init__.py
    - app/main.py
    - app/core
    - app/storage
    - app/services
    - app/workers
    - app/scripts
    - app/models/__init__.py
    - app/models/_base.py
    - app/models/auth.py
    - app/models/admin.py
    - app/models/billing.py
    - app/models/gateway.py
    - app/models/tool.py
    - app/models/tool_install.py
    - app/modules/auth
    - app/modules/entitlements
    - app/modules/admin/__init__.py
    - app/modules/admin/router.py
    - app/modules/admin/schemas.py
    - app/modules/admin/audit
    - app/modules/admin/dashboard
    - app/modules/admin/domains
    - app/modules/admin/notifications
    - app/modules/admin/roles
    - app/modules/admin/settings
    - app/modules/admin/services
    - app/modules/admin/routers/__init__.py
    - app/modules/admin/routers/entitlements.py
    - app/modules/admin/routers/invoices.py
    - app/modules/admin/routers/payments.py
    - app/modules/admin/routers/plans.py
    - app/modules/admin/routers/stats.py
    - app/modules/admin/routers/subscriptions.py
    - app/modules/admin/routers/system_heal.py
    - app/modules/admin/routers/users.py
    - app/modules/landing/__init__.py
    - app/modules/landing/billing
    - app/modules/landing/plans_public
    - app/modules/gateway
    - app/modules/tool
    - app/modules/tool_install
    - app/providers/__init__.py
    - app/providers/base.py
    - alembic.ini
    - alembic
    - Dockerfile.prod
    - entrypoint.sh
    - pyproject.toml
    - requirements.txt

  frontend:
    - package.json
    - package-lock.json
    - tsconfig.json
    - vite.config.ts
    - tailwind.config.js
    - postcss.config.js
    - index.html
    - nginx.conf
    - Dockerfile.prod
    - helper
    - src/main.tsx
    - src/vite-env.d.ts
    - src/assets
    - src/core
    - src/app
    - src/components
    - src/modules/auth
    - src/modules/admin
    - src/modules/gateway
    - src/modules/tool
    - src/modules/tool_distribution
    - src/modules/landing

drop:
  backend:
    - app/modules/admin/git_admin
    - app/modules/landing/public_try
    - app/modules/landing/client_api
    - app/modules/landing/public_v1
    - app/browser
    - app/providers/grok_provider.py
    - app/providers/grok_api_client.py
    - app/providers/_inspect.py
  frontend:
    - src/modules/admin/views/AdminModulesPage.tsx
    - src/modules/admin/views/AdminModuleIframePage.tsx
    - src/modules/admin/views/AdminGitPage.tsx
    - src/modules/admin/services/modules.service.ts

module_registry:
  backend:
    - app.modules.auth
    - app.modules.auth.api_keys
    - app.modules.gateway
    - app.modules.tool
    - app.modules.tool_install
    - app.modules.admin
    - app.modules.admin.dashboard
    - app.modules.admin.audit
    - app.modules.admin.notifications
    - app.modules.admin.domains
    - app.modules.admin.roles
    - app.modules.admin.settings
    - app.modules.landing.billing
    - app.modules.landing.plans_public

# ai-gateway has no Grok models. Without these patches the User
# mapper fails to init because relationships reference dropped
# tables. Also rewrites the dashboard + stats router to use
# GwRequest instead of Job/Profile.
patches:
  - file: backend/app/models/auth.py
    find: |
      api_keys: Mapped[list["ApiKey"]] = relationship(back_populates="user", cascade="all, delete-orphan")
      profiles: Mapped[list["Profile"]] = relationship(back_populates="user", cascade="all, delete-orphan")  # noqa: F821
      jobs: Mapped[list["Job"]] = relationship(back_populates="user", cascade="all, delete-orphan")  # noqa: F821
    replace: |
      api_keys: Mapped[list["ApiKey"]] = relationship(back_populates="user", cascade="all, delete-orphan")
      # ai-gateway: User has no Grok profiles/jobs — those models live in
      # flowgrok / plxeditor-studio. Restore from monorepo if needed.

  - file: backend/app/modules/entitlements/service.py
    find: |
      from app.models import Job, Plan, Subscription, User
    replace: |
      from app.models import Plan, Subscription, User
      try:
          from app.models import Job  # type: ignore[attr-defined]
      except ImportError:
          Job = None  # type: ignore[assignment]

  - file: frontend/src/components/layout/AppShell.tsx
    regex_find: 'import \{ useQuery \}.*?\n'
    regex_replace: ''
  - file: frontend/src/components/layout/AppShell.tsx
    regex_find: ', Boxes \}'
    regex_replace: ' }'
  - file: frontend/src/components/layout/AppShell.tsx
    regex_find: 'import \* as LucideIcons.*?\n'
    regex_replace: ''
  - file: frontend/src/components/layout/AppShell.tsx
    regex_find: 'import \{ adminModulesService \}.*?\n'
    regex_replace: ''
  - file: frontend/src/components/layout/AppShell.tsx
    regex_find: '  // Pull installed modules.*?const NAV: NavEntry\[\] = useMemo\(\(\) => \{.*?\}, \[baseNav, isSuperUser, installedModules\]\);'
    regex_replace: '  const NAV: NavEntry[] = baseNav;'

  - file: frontend/nginx.conf
    regex_find: '(rewrite \^/flow-output/.*?\n)\s+proxy_pass http://backend:8000;'
    regex_replace: '\1        set $flow_backend "http://backend:8000";\n        proxy_pass $flow_backend;'
  - file: frontend/nginx.conf
    regex_find: '    # gatewaygrok-backend reverse proxy.*?location /gateway-api/ \{.*?\n    \}\n'
    regex_replace: ''

  - file: frontend/src/modules/admin/router/index.tsx
    regex_find: '\s*\{ path: "admin/(git|modules|modules/:slug)".*?\},'
    regex_replace: ''

  - file: frontend/src/app/router.tsx
    regex_find: '\{\n\s*path: "/create-video-pro",.*?errorElement: <RouteErrorBoundary />,\s*\},'
    regex_replace: ''
