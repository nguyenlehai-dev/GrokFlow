# flowgrok — product packaging manifest.
#
# Read by `packaging/export.py` to assemble the customer-facing repo
# from the monorepo's canonical sources.
#
# Anatomy of the export:
#   1. Pull every path under `include.backend` from <monorepo>/backend/
#   2. Pull every path under `include.frontend` from <monorepo>/frontend/
#   3. Pull the deploy artifacts in this folder (Dockerfile.prod, compose,
#      deploy/, HANDOFF.md, LICENSE.txt) — already next to this manifest.
#   4. Apply `drop` patches (delete files even if they matched a parent
#      include — used to surgically remove Grok-only routes from shared
#      admin views that reference dropped modules).
#   5. Apply `patches/` (text edits done before commit — same flow we
#      built up live on the VPS during deploy).
#   6. `git push --force` to `remote.url:remote.branch`.

name: flowgrok
label: "FlowGrok — Grok image+video gateway"
brand: "FlowGrok"

remote:
  url: "https://github.com/nt7310063-boop/flowgrok.git"
  branch: main

# Network ports the customer's stack listens on (host side).
# Each product gets a distinct band so multiple products can coexist on
# one VPS for testing — flowgrok 28000/25173, ai-gateway 38000/35173,
# plxeditor-studio 48000/45173.
defaults:
  backend_host_port: 8000
  frontend_host_port: 5173
  postgres_user: flowgrok
  postgres_db: flowgrok

include:
  backend:
    # Core infra
    - app/core
    - app/storage
    - app/services
    - app/browser
    - app/workers
    - app/scripts
    - app/main.py
    - app/__init__.py
    # Shared models
    - app/models/__init__.py
    - app/models/_base.py
    - app/models/auth.py
    - app/models/admin.py
    - app/models/billing.py
    - app/models/grok.py
    - app/models/tool_install.py
    # Shared modules (would-be grokflow-core)
    - app/modules/auth
    - app/modules/entitlements
    - app/modules/admin/__init__.py
    - app/modules/admin/router.py
    - app/modules/admin/schemas.py
    - app/modules/admin/audit
    - app/modules/admin/dashboard
    - app/modules/admin/domains
    - app/modules/admin/gallery
    - app/modules/admin/notifications
    - app/modules/admin/roles
    - app/modules/admin/settings
    - app/modules/admin/services
    - app/modules/admin/routers/__init__.py
    - app/modules/admin/routers/entitlements.py
    - app/modules/admin/routers/invoices.py
    - app/modules/admin/routers/payments.py
    - app/modules/admin/routers/plans.py
    - app/modules/admin/routers/stats.py
    - app/modules/admin/routers/subscriptions.py
    - app/modules/admin/routers/system_heal.py
    - app/modules/admin/routers/users.py
    - app/modules/admin/tools
    # Landing — billing surface + plans catalog (no public_try)
    - app/modules/landing/__init__.py
    - app/modules/landing/billing
    - app/modules/landing/plans_public
    # flowgrok product surface
    - app/modules/grok
    - app/modules/landing/client_api
    - app/modules/landing/public_v1
    # Grok-specific providers + supporting libs
    - app/providers/__init__.py
    - app/providers/base.py
    - app/providers/grok_provider.py
    - app/providers/grok_api_client.py
    - app/providers/_inspect.py
    # Top-level config
    - alembic.ini
    - alembic
    - Dockerfile.prod
    - entrypoint.sh
    - pyproject.toml
    - requirements.txt

  frontend:
    - package.json
    - package-lock.json
    - tsconfig.json
    - vite.config.ts
    - tailwind.config.js
    - postcss.config.js
    - index.html
    - nginx.conf
    - Dockerfile.prod
    - helper
    - src/main.tsx
    - src/vite-env.d.ts
    - src/assets
    - src/core
    - src/app
    - src/components
    - src/modules/auth
    - src/modules/admin
    - src/modules/grok
    - src/modules/landing

drop:
  # Even when parent dir included, kill these files:
  backend:
    - app/modules/admin/git_admin
    - app/modules/landing/public_try
  frontend:
    - src/modules/admin/views/AdminModulesPage.tsx
    - src/modules/admin/views/AdminModuleIframePage.tsx
    - src/modules/admin/views/AdminGitPage.tsx
    - src/modules/admin/services/modules.service.ts

# Module-registry manifests to load on boot. Order = OpenAPI tag order.
module_registry:
  backend:
    - app.modules.auth
    - app.modules.auth.api_keys
    - app.modules.grok.profiles
    - app.modules.grok.jobs
    - app.modules.grok.files
    - app.modules.grok.projects
    - app.modules.admin
    - app.modules.admin.dashboard
    - app.modules.admin.audit
    - app.modules.admin.notifications
    - app.modules.admin.domains
    - app.modules.admin.roles
    - app.modules.admin.settings
    - app.modules.landing.billing
    - app.modules.landing.plans_public
    - app.modules.landing.public_v1
    - app.modules.landing.client_api
  frontend:
    - admin
    - grok
    - auth
    - landing

# Text patches applied to the staged tree before commit. Even though
# flowgrok keeps Grok models, the monorepo admin/dashboard + admin/gallery
# routers also reference FlowJob / Gw* — strip those at export time.
patches:
  - file: backend/app/modules/admin/dashboard/router.py
    find: |
      from app.models import (
          ApiKey, Domain, FlowJob, GwRequest, GwVendor, Job, Payment, Profile, User,
      )
    replace: |
      from app.models import ApiKey, Domain, Job, Payment, Profile, User
      FlowJob = None    # type: ignore[assignment]
      GwRequest = None  # type: ignore[assignment]
      GwVendor = None   # type: ignore[assignment]

  - file: backend/app/modules/admin/gallery/router.py
    find: "from app.models.gateway import GwRequest, GwVendor"
    replace: "# Gateway models dropped from flowgrok."

  - file: frontend/src/components/layout/AppShell.tsx
    regex_find: 'import \{ adminModulesService \}.*?\n'
    regex_replace: ''

  - file: frontend/src/modules/admin/router/index.tsx
    regex_find: '\s*\{ path: "admin/(git|modules|modules/:slug)".*?\},'
    regex_replace: ''

  - file: frontend/src/app/router.tsx
    regex_find: '\{\n\s*path: "/create-video-pro",.*?errorElement: <RouteErrorBoundary />,\s*\},'
    regex_replace: ''
