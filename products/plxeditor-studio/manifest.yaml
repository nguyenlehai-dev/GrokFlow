# plxeditor-studio — product packaging manifest.
#
# Branded all-in-one editor: Grok image+video + Flow video tools.
# See products/flowgrok/manifest.yaml for field documentation.

name: plxeditor-studio
label: "PLX Editor Studio — Grok + Flow editor"
brand: "PLX Editor"

remote:
  url: "https://github.com/nt7310063-boop/plxeditor-studio.git"
  branch: main

defaults:
  backend_host_port: 8000
  frontend_host_port: 5173
  postgres_user: plxeditor
  postgres_db: plxeditor

include:
  backend:
    - app/__init__.py
    - app/main.py
    - app/core
    - app/storage
    - app/services
    - app/browser
    - app/workers
    - app/scripts
    - app/models/__init__.py
    - app/models/_base.py
    - app/models/auth.py
    - app/models/admin.py
    - app/models/billing.py
    - app/models/grok.py
    - app/models/flow.py
    - app/models/tool_install.py
    - app/modules/auth
    - app/modules/entitlements
    - app/modules/admin/__init__.py
    - app/modules/admin/router.py
    - app/modules/admin/schemas.py
    - app/modules/admin/audit
    - app/modules/admin/dashboard
    - app/modules/admin/domains
    - app/modules/admin/gallery
    - app/modules/admin/notifications
    - app/modules/admin/roles
    - app/modules/admin/settings
    - app/modules/admin/services
    - app/modules/admin/routers/__init__.py
    - app/modules/admin/routers/entitlements.py
    - app/modules/admin/routers/invoices.py
    - app/modules/admin/routers/payments.py
    - app/modules/admin/routers/plans.py
    - app/modules/admin/routers/stats.py
    - app/modules/admin/routers/subscriptions.py
    - app/modules/admin/routers/system_heal.py
    - app/modules/admin/routers/users.py
    - app/modules/landing/__init__.py
    - app/modules/landing/billing
    - app/modules/landing/plans_public
    - app/modules/grok
    - app/modules/flow
    - app/modules/landing/client_api
    - app/modules/landing/public_v1
    - app/providers/__init__.py
    - app/providers/base.py
    - app/providers/grok_provider.py
    - app/providers/grok_api_client.py
    - app/providers/_inspect.py
    - alembic.ini
    - alembic
    - Dockerfile.prod
    - entrypoint.sh
    - pyproject.toml
    - requirements.txt

  frontend:
    - package.json
    - package-lock.json
    - tsconfig.json
    - vite.config.ts
    - tailwind.config.js
    - postcss.config.js
    - index.html
    - nginx.conf
    - Dockerfile.prod
    - helper
    - src/main.tsx
    - src/vite-env.d.ts
    - src/assets
    - src/core
    - src/app
    - src/components
    - src/modules/auth
    - src/modules/admin
    - src/modules/grok
    - src/modules/flow
    - src/modules/landing

drop:
  backend:
    - app/modules/admin/git_admin
    - app/modules/landing/public_try
  frontend:
    - src/modules/admin/views/AdminModulesPage.tsx
    - src/modules/admin/views/AdminModuleIframePage.tsx
    - src/modules/admin/views/AdminGitPage.tsx
    - src/modules/admin/services/modules.service.ts

module_registry:
  backend:
    - app.modules.auth
    - app.modules.auth.api_keys
    - app.modules.grok.profiles
    - app.modules.grok.jobs
    - app.modules.grok.files
    - app.modules.grok.projects
    - app.modules.flow
    - app.modules.admin
    - app.modules.admin.dashboard
    - app.modules.admin.audit
    - app.modules.admin.gallery
    - app.modules.admin.notifications
    - app.modules.admin.domains
    - app.modules.admin.roles
    - app.modules.admin.settings
    - app.modules.landing.billing
    - app.modules.landing.plans_public
    - app.modules.landing.public_v1
    - app.modules.landing.client_api

# plxeditor-studio = Grok + Flow. The dashboard + gallery routers in the
# monorepo import Gateway models which we drop — patches stub those
# references so SQLAlchemy + FastAPI boot cleanly.
patches:
  - file: backend/app/modules/admin/dashboard/router.py
    regex_find: 'from app\.models import \(\n    ApiKey, Domain, FlowJob, GwRequest, GwVendor, Job, Payment, Profile, User,\n\)'
    regex_replace: "from app.models import ApiKey, Domain, FlowJob, Job, Payment, Profile, User\nGwRequest = None  # type: ignore[assignment]\nGwVendor = None   # type: ignore[assignment]"

  - file: backend/app/modules/admin/gallery/router.py
    find: "from app.models.gateway import GwRequest, GwVendor"
    replace: "GwRequest = None  # type: ignore[assignment]\nGwVendor = None   # type: ignore[assignment]"

  # Replace gallery /gateway endpoint body — always returns empty since
  # plxeditor-studio doesn't ship the gateway product.
  - file: backend/app/modules/admin/gallery/router.py
    regex_find: '@router\.get\("/gateway", response_model=GatewayGalleryPage\)\nasync def list_gateway_gallery\([^)]*\) -> GatewayGalleryPage:\n.*?return GatewayGalleryPage[^)]*\)'
    regex_replace: |
      @router.get("/gateway", response_model=GatewayGalleryPage)
      async def list_gateway_gallery(
          user: CurrentUser, db: DbSession,
          vendor_code: str | None = Query(default=None),
          function_code: str | None = Query(default=None),
          domain_id: uuid.UUID | None = Query(default=None),
          date_from: datetime | None = Query(default=None),
          date_to: datetime | None = Query(default=None),
          offset: int = Query(default=0, ge=0),
          limit: int = Query(default=30, ge=1, le=100),
      ) -> GatewayGalleryPage:
          # plxeditor-studio doesn't ship the gateway product — always empty.
          return GatewayGalleryPage(items=[], total=0, offset=offset, limit=limit)

  # plxeditor-studio has FlowJob + Job but NOT GwRequest/GwVendor —
  # replace the Gateway section in the dashboard with an empty list.
  - file: backend/app/modules/admin/dashboard/router.py
    regex_find: '    # -+ Gateway LLM \(per-vendor breakdown\).*?gw_items = \[[^\]]*\]'
    regex_replace: '    gw_items: list[AppItem] = []  # Gateway dropped from plxeditor-studio'

  - file: frontend/src/components/layout/AppShell.tsx
    regex_find: 'import \{ useQuery \}.*?\n'
    regex_replace: ''
  - file: frontend/src/components/layout/AppShell.tsx
    regex_find: ', Boxes \}'
    regex_replace: ' }'
  - file: frontend/src/components/layout/AppShell.tsx
    regex_find: 'import \* as LucideIcons.*?\n'
    regex_replace: ''
  - file: frontend/src/components/layout/AppShell.tsx
    regex_find: 'import \{ adminModulesService \}.*?\n'
    regex_replace: ''
  - file: frontend/src/components/layout/AppShell.tsx
    regex_find: '  // Pull installed modules.*?const NAV: NavEntry\[\] = useMemo\(\(\) => \{.*?\}, \[baseNav, isSuperUser, installedModules\]\);'
    regex_replace: '  const NAV: NavEntry[] = baseNav;'

  - file: frontend/nginx.conf
    regex_find: '(rewrite \^/flow-output/.*?\n)\s+proxy_pass http://backend:8000;'
    regex_replace: '\1        set $flow_backend "http://backend:8000";\n        proxy_pass $flow_backend;'
  - file: frontend/nginx.conf
    regex_find: '    # gatewaygrok-backend reverse proxy.*?location /gateway-api/ \{.*?\n    \}\n'
    regex_replace: ''

  - file: frontend/src/modules/admin/router/index.tsx
    regex_find: '\s*\{ path: "admin/(git|modules|modules/:slug)".*?\},'
    regex_replace: ''

  - file: frontend/src/app/router.tsx
    regex_find: '\{\n\s*path: "/create-video-pro",.*?errorElement: <RouteErrorBoundary />,\s*\},'
    regex_replace: ''
