services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: grokflow
      POSTGRES_PASSWORD: grokflow
      POSTGRES_DB: grokflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grokflow"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://grokflow:grokflow@postgres:5432/grokflow
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
      - profile_data:/app/browser_profiles

  worker:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://grokflow:grokflow@postgres:5432/grokflow
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.workers.run"]
    volumes:
      - ./backend:/app
      - storage_data:/app/storage
      - profile_data:/app/browser_profiles

  # Default frontend = Vite dev server with HMR (for local `docker compose up`).
  # Mounts the source tree so edits hot-reload without rebuilding.
  frontend:
    build:
      context: ./frontend
      target: dev
    env_file: ./frontend/.env
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  # Prod frontend = prebuilt static bundle served by nginx. Opt in with
  # `docker compose --profile prod up -d frontend-prod` on the VPS, AFTER
  # stopping the dev `frontend` service so the port doesn't collide.
  # No source volume mount → image is immutable / cacheable / smaller.
  frontend-prod:
    build:
      context: ./frontend
      target: prod
    ports:
      - "5173:5173"
    depends_on:
      - backend
    profiles: ["prod"]

volumes:
  postgres_data:
  storage_data:
  profile_data:
