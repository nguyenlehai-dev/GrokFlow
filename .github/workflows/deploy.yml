name: Deploy

on:
  push:
    branches: [prod, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [staging, prod]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Trigger deploy on server
        run: |
          ssh -i ~/.ssh/id_ed25519 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
              "cd /opt/grokflow && BRANCH=${{ github.ref_name }} TAG=${{ github.sha }} bash deploy/deploy.sh"

      - name: Smoke check
        run: |
          curl -fsS --max-time 10 "https://${{ secrets.HEALTH_URL }}/health" | tee /dev/stderr | grep -q '"status":"ok"'
