name: Deploy

# Auto-deploy is handled VPS-side by a cron job that polls origin/prod
# every minute (see deploy/auto_deploy.sh and docs/BRANCHING.md).
# The cron approach removed the need for GitHub runners to reach the
# LAN-only VPS over SSH.
#
# This workflow is kept as a manual gate: it runs on prod-branch push
# to log the deploy event in GitHub's Actions tab (visible audit trail)
# and optionally pings a public health URL after the VPS has had a
# chance to pull. No SSH from the runner.

on:
  push:
    branches: [prod, staging]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Log deploy intent
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Author: ${{ github.event.head_commit.author.name }}"
          echo "Message: ${{ github.event.head_commit.message }}"
          echo ""
          echo "VPS cron will pull this commit within 60s. Tail"
          echo "/var/log/grokflow-deploy.log on the VPS to watch."

      - name: Wait for VPS to pull (90s grace)
        run: sleep 90

      - name: Public health check (optional)
        env:
          # Branch-specific secret takes precedence so staging can point at a
          # different URL than prod. Falls back to HEALTH_URL for compat.
          HEALTH_URL_PROD: ${{ secrets.HEALTH_URL_PROD }}
          HEALTH_URL_STAGING: ${{ secrets.HEALTH_URL_STAGING }}
          HEALTH_URL: ${{ secrets.HEALTH_URL }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            prod)    URL="${HEALTH_URL_PROD:-$HEALTH_URL}" ;;
            staging) URL="${HEALTH_URL_STAGING:-$HEALTH_URL}" ;;
            *)       URL="$HEALTH_URL" ;;
          esac
          if [ -z "$URL" ]; then
            echo "No health URL configured for branch '$REF_NAME' — skipping smoke check."
            exit 0
          fi
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 "https://$URL/health" 2>&1 | grep -q '"status":"ok"'; then
              echo "Health check passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i: not yet healthy, retrying in 15s..."
            sleep 15
          done
          echo "Health check failed after 10 attempts."
          exit 1
