# Local dev with a mock GrokFlow core.
# Run: docker compose -f docker-compose.dev.yml up
# Open http://localhost:5173 — module talks to mock-core via /api proxy.

services:
  module-be:
    build: ./backend
    ports: ["8001:8000"]
    environment:
      GROKFLOW_API_URL: "http://mock-core:9000/api/sdk"
      GROKFLOW_SERVICE_TOKEN: "dev-service-token"
      MODULE_SLUG: "hello_world"

  module-fe:
    build:
      context: ./frontend
    ports: ["5173:80"]
    depends_on: [module-be]

  mock-core:
    # Tiny http stub that pretends to be /api/sdk/* — returns a fake user
    # for any service token + user token combo so the module can run
    # without the full GrokFlow stack.
    image: node:20-alpine
    working_dir: /srv
    command: node mock.js
    ports: ["9000:9000"]
    volumes:
      - ./mock-core:/srv:ro
