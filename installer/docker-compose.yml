# GrokFlow — self-hosted single-PC install.
#
# Differences from docker-compose.prod.yml:
#   - No Caddy / Let's Encrypt — plain HTTP on http://localhost:${HTTP_PORT}
#   - All service ports bound to 127.0.0.1 (no LAN exposure)
#   - One-shot `init` runs migrations + seeds default admin on first boot
#   - WARP / proxy disabled — PC users don't need the bot-wall bypass
#   - No image build context — uses pre-built images bundled in the installer

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grokflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-grokflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grokflow}"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # One-shot bootstrap: alembic migrations + first-run seed. Backend &
  # worker wait for this to finish before starting, so the schema is
  # guaranteed ready and a default super_admin exists.
  init:
    image: grokflow/backend:${TAG:-latest}
    restart: "no"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-grokflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-grokflow}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        echo "[init] running alembic migrations..."
        alembic upgrade head
        echo "[init] running first-run seed..."
        python -m app.scripts.seed_first_run
        echo "[init] done."

  backend:
    image: grokflow/backend:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-grokflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-grokflow}
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /app/storage
      PROFILE_BASE_PATH: /app/browser_profiles
      GUNICORN_WORKERS: "2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    volumes:
      - storage_data:/app/storage
      - profile_data:/app/browser_profiles

  worker:
    image: grokflow/backend:${TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-grokflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-grokflow}
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /app/storage
      PROFILE_BASE_PATH: /app/browser_profiles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    volumes:
      - storage_data:/app/storage
      - profile_data:/app/browser_profiles
    command: ["python", "-m", "app.workers.run"]

  frontend:
    image: grokflow/frontend:${TAG:-latest}
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.1 only — no LAN/Internet exposure. Customer
      # accesses via http://localhost:${HTTP_PORT}. Change HTTP_PORT in
      # .env if port 80 conflicts.
      - "127.0.0.1:${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  storage_data:
  profile_data:
