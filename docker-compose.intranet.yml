# Intranet HTTP deployment — truy cập qua http://<server-ip>:5173 (FE) và :8000 (API).
# Dùng cho LAN/staging không có TLS. Production public nên dùng docker-compose.cloudflare.yml.

# Container log rotation: cap each container's stdout/stderr to 50MB × 3
# rotated files (150MB max per container). Without this, busy services
# like worker can accumulate GB of logs over weeks.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grokflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-grokflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grokflow}"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { memory: 1G, cpus: "1.0" }
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { memory: 384M, cpus: "0.5" }
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: grokflow/backend:${TAG:-latest}
    restart: unless-stopped
    env_file: ./.env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-grokflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-grokflow}
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /app/storage
      PROFILE_BASE_PATH: /app/browser_profiles
      # Host path so backend can pass it to spawned VNC containers via Docker API.
      PROFILE_BASE_PATH_HOST: ${PWD}/browser_profiles
      # SSH credentials for /admin → Git/Deploy (used by app/modules/git_admin).
      # All four come from .env.prod so secrets stay out of source control.
      HOST_SSH_HOST: ${HOST_SSH_HOST:-host.docker.internal}
      HOST_SSH_PORT: ${HOST_SSH_PORT:-22}
      HOST_SSH_USER: ${HOST_SSH_USER:-vpsroot}
      HOST_SSH_PASSWORD: ${HOST_SSH_PASSWORD:-}
      HOST_GROKFLOW_PATH: ${HOST_GROKFLOW_PATH:-/home/vpsroot/grokflow}
      # gatewaygrok-backend SSO proxy. Backend logs in with these creds and
      # forwards Gateway page requests with the cached admin token.
      GATEWAY_BACKEND_URL: ${GATEWAY_BACKEND_URL:-http://host.docker.internal:8001}
      GATEWAY_ADMIN_USERNAME: ${GATEWAY_ADMIN_USERNAME:-admin}
      GATEWAY_ADMIN_PASSWORD: ${GATEWAY_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage
      # Bind mount so paths inside backend match host paths (needed for spawning VNC).
      - ./browser_profiles:/app/browser_profiles
      - /var/run/docker.sock:/var/run/docker.sock
      # Host-managed dir for per-domain nginx vhost files. Backend writes
      # .conf files here; host nginx includes them via grokflow.conf; a host
      # reloader picks up changes. See deploy/setup-host-nginx.sh.
      - /etc/nginx/grokflow-vhosts:/host_nginx_vhosts
    # Allow container to reach host's SSH (deploy/git operations from /admin).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 768M, cpus: "1.0" }
    logging: *default-logging

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: grokflow/backend:${TAG:-latest}
    restart: unless-stopped
    env_file: ./.env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-grokflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-grokflow}
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /app/storage
      PROFILE_BASE_PATH: /app/browser_profiles
      # Cap concurrent in-flight tasks; sized to fit per-profile slots.
      # Each in-flight task drives 1 Chromium tab (~150MB inside VNC container).
      WORKER_MAX_IN_FLIGHT: ${WORKER_MAX_IN_FLIGHT:-8}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
      - ./browser_profiles:/app/browser_profiles
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "-m", "app.workers.run"]
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }
    logging: *default-logging

  idle-cleanup:
    image: grokflow/backend:${TAG:-latest}
    restart: unless-stopped
    env_file: ./.env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-grokflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-grokflow}
      LOCAL_STORAGE_PATH: /app/storage
      PROFILE_BASE_PATH: /app/browser_profiles
      PROFILE_BASE_PATH_HOST: ${PWD}/browser_profiles
      # Aggressive defaults: stop idle VNC after 2h and reap orphan containers
      # every 15min so a quiet system stays under 1GB total.
      IDLE_CLEANUP_HOURS: ${IDLE_CLEANUP_HOURS:-2}
      IDLE_CLEANUP_INTERVAL: ${IDLE_CLEANUP_INTERVAL:-900}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./browser_profiles:/app/browser_profiles
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "-m", "app.workers.idle_cleanup"]
    deploy:
      resources:
        limits: { memory: 192M, cpus: "0.25" }
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    image: grokflow/frontend:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "5173:80"
    # So nginx can reach gatewaygrok-backend running on host port 8001
    # via the /gateway-api/* proxy location.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.25" }
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  storage_data:
