# Intranet HTTP deployment — truy cập qua http://<server-ip>:5173 (FE) và :8000 (API).
# Dùng cho LAN/staging không có TLS. Production public nên dùng docker-compose.cloudflare.yml.

# Container log rotation: cap each container's stdout/stderr to 50MB × 3
# rotated files (150MB max per container). Without this, busy services
# like worker can accumulate GB of logs over weeks.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grokflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-grokflow}
    # Bumped from defaults for a multi-tenant SaaS workload — shared_buffers
    # gets ~25% of the container's RAM cap, effective_cache_size another 50%
    # so the planner knows the OS pagecache is doing heavy lifting. work_mem
    # at 8 MB keeps sort/hash operations off temp files for typical paginated
    # admin queries.
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - max_connections=80
      - -c
      - random_page_cost=1.1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grokflow}"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        # Bumped from 1G → 2G — shared_buffers 512MB + maintenance_work_mem
        # 128MB + work_mem buffers (80 conns × 8MB peak) need headroom.
        limits: { memory: 2G, cpus: "1.0" }
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "384mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512M, cpus: "0.5" }
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: grokflow/backend:${TAG:-latest}
    restart: unless-stopped
    env_file: ./.env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-grokflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-grokflow}
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /app/storage
      PROFILE_BASE_PATH: /app/browser_profiles
      # Host path so backend can pass it to spawned VNC containers via Docker API.
      PROFILE_BASE_PATH_HOST: ${PWD}/browser_profiles
      # SSH credentials for /admin → Git/Deploy (used by app/modules/git_admin).
      # All four come from .env.prod so secrets stay out of source control.
      HOST_SSH_HOST: ${HOST_SSH_HOST:-host.docker.internal}
      HOST_SSH_PORT: ${HOST_SSH_PORT:-22}
      HOST_SSH_USER: ${HOST_SSH_USER:-vpsroot}
      HOST_SSH_PASSWORD: ${HOST_SSH_PASSWORD:-}
      # Async UvicornWorker handles many concurrent requests per process,
      # so 1 per vCPU is the right baseline for a 2-vCPU VPS. The old
      # default of 4 wasted ~400 MB on duplicate process state.
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      HOST_GROKFLOW_PATH: ${HOST_GROKFLOW_PATH:-/home/vpsroot/grokflow}
      # NOTE: legacy `gatewaygrok-backend` SSO proxy env vars were removed in
      # May 2026 — that external service was replaced by the LLM Gateway
      # module inside this very backend (/api/v1/gateway/*). If you see
      # GATEWAY_BACKEND_URL / GATEWAY_ADMIN_USERNAME / GATEWAY_ADMIN_PASSWORD
      # referenced anywhere else in the repo, it's dead code — safe to drop.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      # Host port overridable so prod (default 8000) and staging
      # (e.g. 18000 via .env.staging) can coexist on the same host.
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - storage_data:/app/storage
      # Bind mount so paths inside backend match host paths (needed for spawning VNC).
      - ./browser_profiles:/app/browser_profiles
      - /var/run/docker.sock:/var/run/docker.sock
      # Host-managed dir for per-domain nginx vhost files. Backend writes
      # .conf files here; host nginx includes them via grokflow.conf; a host
      # reloader picks up changes. See deploy/setup-host-nginx.sh.
      - /etc/nginx/grokflow-vhosts:/host_nginx_vhosts
    # Allow container to reach host's SSH (deploy/git operations from /admin).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Cloudflare WARP daemon (started by entrypoint.sh) needs these to set
    # up its tunnel. Without them, WARP self-skips and the backend's
    # httpx fall back to direct connections — Cloudflare gradually flags
    # the VPS IP, image API starts 403-ing, jobs drop to slow DOM path.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        # Bumped from 768M to 1.5G because the Flow module now runs FFmpeg
        # in-process via BackgroundTasks. One 1080p encode peaks ~600 MB;
        # leave headroom for concurrent jobs + the normal API request load.
        limits: { memory: 1536M, cpus: "1.5" }
    logging: *default-logging

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: grokflow/backend:${TAG:-latest}
    restart: unless-stopped
    env_file: ./.env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-grokflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-grokflow}
      REDIS_URL: redis://redis:6379/0
      LOCAL_STORAGE_PATH: /app/storage
      PROFILE_BASE_PATH: /app/browser_profiles
      # Cap concurrent in-flight tasks; sized to fit per-profile slots.
      # Each in-flight task drives 1 Chromium tab (~150MB inside VNC container).
      WORKER_MAX_IN_FLIGHT: ${WORKER_MAX_IN_FLIGHT:-8}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - storage_data:/app/storage
      - ./browser_profiles:/app/browser_profiles
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "-m", "app.workers.run"]
    # Worker makes the actual provider httpx calls (backend just queues
    # jobs to DB). It MUST be on WARP — same reason as backend above.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    # Disable the inherited HEALTHCHECK from Dockerfile.prod (curl /health
    # on port 8000 — fine for the API, but worker only runs the queue
    # consumer, no HTTP server). Process-presence checks need procps which
    # the slim image doesn't ship. `restart: unless-stopped` above already
    # handles worker process death, so no healthcheck signal is needed.
    healthcheck:
      test: ["NONE"]
    deploy:
      resources:
        limits: { memory: 512M, cpus: "1.0" }
    logging: *default-logging

  idle-cleanup:
    image: grokflow/backend:${TAG:-latest}
    restart: unless-stopped
    env_file: ./.env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-grokflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-grokflow}
      LOCAL_STORAGE_PATH: /app/storage
      PROFILE_BASE_PATH: /app/browser_profiles
      PROFILE_BASE_PATH_HOST: ${PWD}/browser_profiles
      # Aggressive defaults: stop idle VNC after 2h and reap orphan containers
      # every 15min so a quiet system stays under 1GB total.
      IDLE_CLEANUP_HOURS: ${IDLE_CLEANUP_HOURS:-2}
      IDLE_CLEANUP_INTERVAL: ${IDLE_CLEANUP_INTERVAL:-900}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./browser_profiles:/app/browser_profiles
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["python", "-m", "app.workers.idle_cleanup"]
    # Same reason as worker — disable inherited curl-based healthcheck.
    healthcheck:
      test: ["NONE"]
    deploy:
      resources:
        limits: { memory: 192M, cpus: "0.25" }
    logging: *default-logging

  # Long-running server health-check loop. Probes every monitor_enabled
  # Server row over SSH every ~60s, appends to server_metrics_history,
  # raises/clears alerts when thresholds trip. Tiny — paramiko + asyncio,
  # 64M RAM is plenty for ~50 servers.
  server-monitor:
    image: grokflow/backend:${TAG:-latest}
    restart: unless-stopped
    env_file: ./.env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-grokflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-grokflow}
      SERVER_MONITOR_INTERVAL: ${SERVER_MONITOR_INTERVAL:-60}
      SERVER_METRICS_RETENTION_DAYS: ${SERVER_METRICS_RETENTION_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "app.workers.server_monitor"]
    healthcheck:
      test: ["NONE"]
    deploy:
      resources:
        limits: { memory: 192M, cpus: "0.25" }
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    image: grokflow/frontend:${TAG:-latest}
    restart: unless-stopped
    ports:
      # Host port overridable so prod (default 5173) and staging
      # (e.g. 15173 via .env.staging) can coexist on the same host.
      - "${FRONTEND_HOST_PORT:-5173}:80"
    # Frontend doesn't need host.docker.internal anymore (the legacy
    # gatewaygrok proxy is gone). Remove this block if you don't host
    # any other side-services on the VPS that nginx needs to reach.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # The inherited HEALTHCHECK from Dockerfile.prod uses `wget` against
    # `http://localhost/`, which fails to resolve inside busybox-alpine
    # despite nginx actively serving real traffic. Disable — `restart:
    # unless-stopped` plus the live traffic volume is enough liveness signal.
    healthcheck:
      test: ["NONE"]
    deploy:
      resources:
        limits: { memory: 128M, cpus: "0.25" }
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  storage_data:
