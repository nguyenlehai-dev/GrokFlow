daemon off;
pid /tmp/nginx.pid;
error_log /tmp/nginx-cdp.log warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # CDP proxy: 9223 → 9222 with Host: localhost rewrite.
    # Chrome rejects DevTools requests whose Host header is not localhost.
    server {
        listen 0.0.0.0:9223;
        location / {
            proxy_pass http://127.0.0.1:9222;
            proxy_http_version 1.1;
            proxy_set_header Host localhost:9222;
            proxy_set_header Origin http://localhost:9222;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }
    }
}
