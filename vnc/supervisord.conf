[supervisord]
nodaemon=true
user=root
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1366x768x24 -ac +extension GLX +render -noreset
user=vncuser
autostart=true
autorestart=true
priority=100
stdout_logfile=/tmp/sv-xvfb.log
stderr_logfile=/tmp/sv-xvfb.log

[program:autocutsel-primary]
# Bridge X11 PRIMARY (xterm-style middle-click selection) and CLIPBOARD
# (Ctrl+C/V) so x11vnc's clipboard sync sees both. Chromium writes only
# to CLIPBOARD by default; without these two daemons the noVNC clipboard
# panel can read what user copied IN the iframe but pasting INTO Chromium
# would still drop on the floor.
command=/usr/bin/autocutsel -fork -selection PRIMARY
user=vncuser
environment=DISPLAY=":1"
autostart=true
autorestart=true
priority=150
startsecs=1
stdout_logfile=/tmp/sv-autocutsel-p.log
stderr_logfile=/tmp/sv-autocutsel-p.log

[program:autocutsel-clipboard]
command=/usr/bin/autocutsel -fork -selection CLIPBOARD
user=vncuser
environment=DISPLAY=":1"
autostart=true
autorestart=true
priority=151
startsecs=1
stdout_logfile=/tmp/sv-autocutsel-c.log
stderr_logfile=/tmp/sv-autocutsel-c.log

[program:x11vnc]
# -clip and -nocursorshape help noVNC clipboard sync.
# x11vnc tracks PRIMARY by default; autocutsel above mirrors CLIPBOARD into
# PRIMARY so Chromium's Ctrl+C reaches the VNC clipboard buffer.
command=/usr/bin/x11vnc -display :1 -nopw -listen 0.0.0.0 -xkb -shared -forever -rfbport 5901 -o /tmp/x11vnc.log
user=vncuser
autostart=true
autorestart=true
priority=200
startsecs=2
stdout_logfile=/tmp/sv-x11vnc.log
stderr_logfile=/tmp/sv-x11vnc.log

[program:novnc]
command=/usr/bin/websockify --web /usr/share/novnc/ 6901 localhost:5901
user=vncuser
autostart=true
autorestart=true
priority=300
startsecs=2
stdout_logfile=/tmp/sv-novnc.log
stderr_logfile=/tmp/sv-novnc.log

[program:chromium]
command=/launch-chromium.sh
user=vncuser
environment=HOME=/home/vncuser,DISPLAY=":1"
autostart=true
autorestart=true
priority=400
startsecs=5
stdout_logfile=/tmp/sv-chromium.log
stderr_logfile=/tmp/sv-chromium.log

[program:cdp-proxy]
# Chrome binds CDP to 127.0.0.1 only AND rejects requests with Host header
# != localhost. nginx proxies 9223 → 9222 while rewriting Host so worker can attach.
command=/usr/sbin/nginx -c /etc/nginx/cdp-proxy.conf
user=vncuser
autostart=true
autorestart=true
priority=500
startsecs=2
stdout_logfile=/tmp/sv-cdp-proxy.log
stderr_logfile=/tmp/sv-cdp-proxy.log
