# Resolve service names at request time so a backend/VNC restart with new IP
# doesn't strand nginx with a stale cached IP (502 connection refused).
# Short TTL because VNC container is spawned dynamically — old NXDOMAIN cache
# would wedge the iframe for up to TTL seconds after start.
resolver 127.0.0.11 valid=2s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Per-profile VNC: /vnc/<12-hex-id>/...  →  http://grokflow-vnc-<id>:6901/...
    # Each profile has its own persistent VNC container with Chromium + CDP open.
    location ~ "^/vnc/([a-f0-9]{12})/(.*)$" {
        set $vnc_upstream "http://grokflow-vnc-$1:6901";
        proxy_pass $vnc_upstream/$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location ~ "^/vnc/([a-f0-9]{12})/?$" {
        return 302 /vnc/$1/vnc.html?autoconnect=1&resize=remote;
    }

    # Proxy backend routes
    location ~ ^/(api|v1|docs|redoc|openapi\.json|health) {
        set $backend "http://backend:8000";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
